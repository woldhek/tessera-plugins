commands:
  # What cineville.get_film answers, for a film's detail page (the bench gives the same answer for every film).
  "call_service:cineville.get_film":
    id: db2148e7-9d83-4118-a636-7064e9a2d29b
    title: All of a Sudden
    directors: Ryusuke Hamaguchi
    year: 2026
    duration: 196
    highlight: week
    blurb_lines: ["Tao Okamoto en Virginie Efira wandelen door", " Parijs en filosoferen over een betere", " wereld,
                  in deze lekkere lange film van", " Ryûsuke Hamaguchi (Drive My Car)."]
    has_trailer: true
    player: Woonkamer TV
    seen: false
    shows: [{ at: "{epoch+35m}", venue: Kriterion }, { at: "{epoch+3h}", venue: Eye },
            { at: "{epoch+26h}", venue: LAB111 }, { at: "{epoch+50h}", venue: Filmhallen }]

