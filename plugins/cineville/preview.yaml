# What tools/preview.py shows: the tile and its card with the two sensors of the Cineville integration as Home
# Assistant has them (docs/PREVIEW.md). The films are what played in Amsterdam in the week of 30 October 2026;
# {epoch+2h} is a moment two hours after the render, in seconds since 1970, as the integration writes next_start.
tiles:
  - tile: films
    name: Cineville Amsterdam
    entity: sensor.cineville_amsterdam_now_showing
    options: { period: week, picks_only: false }
  - tile: films
    name: Today
    entity: sensor.cineville_amsterdam_now_showing
    options: { period: today, picks_only: false }
    sizes: [2x2, 1x1]
  - tile: films
    name: Picks
    entity: sensor.cineville_amsterdam_now_showing
    options: { period: week, picks_only: true }
    sizes: [2x2]
  - tile: films
    name: Coming soon
    entity: sensor.cineville_amsterdam_coming_soon
    sizes: [2x2, 3x2]
  - tile: films
    name: No sensor yet
    sizes: [2x1]

