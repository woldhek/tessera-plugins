# The manifest: who made the plugin, what it may do, and what the Tessera app shows. It holds no code and no words:
# every name, label and hint below is a key into translations/<language>.json, part "app".
# Every field is explained in docs/MANIFEST.md.
#
# EXPERIMENTAL. The trailer camera of the Cineville integration live on a tile (github.com/woldhek/ha-cineville, branch
# experimental-trailer, option "Trailer camera (experimental)"). On the dev branch only: a live place needs plugin
# API 0.17. To roll back, remove the plugin from the screen; nothing else depends on it.
id: cineville_trailer
version: 0.1.0
# 0.17: the address camera:<entity> and ui::live, a tile's camera streaming.
api: "0.17"
icon: movie-open
maintainer: woldhek
license: MIT
stage: beta
topics: [media, fun]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 4

tiles:
  - id: trailer
    name: tile_name
    icon: movie-open
    sizes: { min: 2x1, max: 4x4 }
    # One place and one label.
    memory: 400
    pictures: 1
    domains: [camera]
    # Only the trailer cameras of the Cineville integration.
    has_attributes: [cineville_trailer]
    attributes: [film_title]
    example: tile_example
    preview: { title: "{film_title}" }
