# What tools/preview.py shows: the data of your tiles on every kind of screen (docs/PREVIEW.md). Every part is
# optional; without this file each tile type is shown once with its defaults. Never put a secret here.
tiles:
  - tile: tasks
    size: 2x2
    options:
      entity: todo.shopping_list
    data:
      items:
        - uid: "1"
          summary: "Boodschappen doen"
          status: "needs_action"
        - uid: "2"
          summary: "Tessera plugin testen"
          status: "completed"



# answers:   the answer of each fetch by its id, as the web service gives it (docs/PREVIEW.md)
# states:    entities as Home Assistant has them, for a tile of an entity or a homeassistant sensor of plugin.yaml
# commands:  answers to the questions of permissions.ha_commands
# cards:     the entity a card of the manifest opens with
# pictures:  a file beside this one for each address a tile's places show (plugin API 0.10)
# savers:    the screensavers to show, each with its options, the data of its step and the file saver:picture shows
#            (plugin API 0.14, docs/PREVIEW.md "Screensavers")
